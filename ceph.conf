[global]
    mon host = 127.0.0.1
    auth cluster required = none
    auth service required = none
    auth client required = none
    osd pool default size = 1
    osd pool default min size = 1

[mon]
    log file = /dev/stderr
    # This is a bounded, single-node test fixture (small mon store + a
    # thin-provisioned bluestore file), so a strict host-disk-percentage
    # check is inappropriate here — it can trip on shared/CI disks that are
    # otherwise fine for our tiny footprint.
    mon data avail warn = 10
    mon data avail crit = 1

[mgr]
    log file = /dev/stderr

[osd]
    log file = /dev/stderr
    # File-backed BlueStore: no real block/loop device needed, so no
    # --privileged or extra capabilities required. Sparse file, thin
    # provisioned, so this bounds growth rather than pre-allocating it.
    bluestore block size = 5368709120

[client.rgw.test]
    rgw enable apis = s3, admin, iam, sts
    log file = /dev/stdout
